{% set version = "0.2.3" %}
{% set sha256 = "212feed38d566d772648768b78d3347c148ef23915b91c02078188e631316c86" %}

package:
  name: traittypes
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/traittypes/traittypes-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: python -m pip install --no-deps --no-build-isolation --ignore-installed .

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - traitlets >=4.2.2

test:
  imports:
    - traittypes
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/jupyter-widgets/traittypes
  license: BSD-3-Clause
  license_family: BSD
  summary: Trait types for NumPy, SciPy and friends
  license_file: LICENSE
  dev_url: https://github.com/jupyter-widgets/traittypes
  doc_url: https://github.com/jupyter-widgets/traittypes

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jasongrout
    - maartenbreddels:
        - vidartf
